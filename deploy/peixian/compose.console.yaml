name: peixian-console
services:
  console:
    container_name: peixian-console
    image: ${PEIXIAN_CONTROL_IMAGE:-peixian-control:console-r2-roles}
    user: "10001:10001"
    init: true
    read_only: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    ports:
      - "127.0.0.1:14090:8080"
    environment:
      CONTROL_DATA: /data
      CONTROL_KEY_FILE: /run/secrets/control-key
      WORKER_KEY_FILE: /run/secrets/worker-key
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      CONSOLE_ORIGINS: http://127.0.0.1:14090,http://localhost:14090
      MAX_RUNTIMES: "4"
    volumes:
      - console-data:/data
    secrets:
      - source: control-key
        target: control-key
      - source: worker-key
        target: worker-key
      - source: admin-password
        target: admin-password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  console-data:
secrets:
  control-key:
    file: ./.secrets/console-control.key
  worker-key:
    file: ./.secrets/console-worker.key
  admin-password:
    file: ./.secrets/console-admin.password
